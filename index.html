<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laporan Google-Drive</title>
<style>
:root{
  --green:#1b8a3f;
  --green-dark:#146c31;
  --green-soft:#e9f6ee;
  --green-line:#cfe9d8;
  --ink:#1f2d24;
  --muted:#6b7b70;
  --line:#e6ece8;
  --bg:#f4f7f5;
  --white:#fff;
  --radius:14px;
}
*{box-sizing:border-box}
body{
  margin:0;padding:24px;background:var(--bg);
  font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;
  color:var(--ink);
}
.wrap{max-width:820px;margin:0 auto}

.card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:0 1px 3px rgba(20,60,35,.05)}

/* ---------- TOP BAR ---------- */
.topbar{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--white)}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.brand .dot{width:32px;height:32px;border-radius:9px;background:var(--green-soft);display:flex;align-items:center;justify-content:center;font-size:16px}
.brand b{font-size:15px;color:var(--ink)}
.topbar-right{display:flex;align-items:center;gap:10px}

.date-pill{position:relative;display:inline-flex;align-items:center;gap:7px;background:var(--white);border:1px solid #dbe4dd;border-radius:999px;padding:7px 12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.date-pill input[type=date]{border:0;outline:0;background:transparent;font-size:13px;color:var(--ink);font-family:inherit;width:100px;cursor:pointer}
.date-pill input[type=date]::-webkit-calendar-picker-indicator{opacity:0;position:absolute;inset:0;width:100%;height:100%;cursor:pointer}
.date-pill .cs{color:#9fb0a6;font-size:12px;pointer-events:none}

.chev{color:var(--muted);font-size:15px;cursor:pointer;padding:7px 9px;border-radius:9px;user-select:none;transition:.15s}
.chev:hover{background:var(--green-soft)}
.topbar.open .chev{transform:rotate(180deg)}

/* ---------- BODY (collapsible) ---------- */
.body{max-height:0;overflow:hidden;transition:max-height .18s ease}

/* Banner hijau */
.banner{margin:16px;padding:18px 20px;border-radius:var(--radius);background:linear-gradient(120deg,#eaf7ef,#f2fbf5);border:1px solid var(--green-line);position:relative;overflow:hidden}
.banner:after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:rgba(27,138,63,.06)}
.chip-tag{display:inline-flex;align-items:center;gap:6px;background:var(--green-soft);color:var(--green-dark);font-size:11px;font-weight:700;letter-spacing:.4px;padding:5px 11px;border-radius:999px;text-transform:uppercase}
.banner h1{margin:12px 0 6px;font-size:22px;color:var(--ink)}
.banner p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.6;max-width:560px}

/* Section */
.section{margin:0 16px 16px;padding:16px 18px;border:1px solid var(--line);border-radius:var(--radius)}
.section-title{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.5px;color:var(--muted);text-transform:uppercase;margin-bottom:14px}

/* Chips bulan */
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{
  border:1px solid #dce6e0;background:var(--white);color:var(--ink);
  padding:9px 16px;border-radius:10px;font-size:13.5px;font-weight:600;cursor:pointer;
  transition:.14s;user-select:none;
}
.chip:hover{border-color:var(--green);color:var(--green-dark);background:#f6fbf8}
.chip.active{background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 2px 6px rgba(27,138,63,.28)}

/* Panel isi */
.content{margin:0 16px 16px}
.placeholder{border:1px dashed #d7e2db;border-radius:var(--radius);padding:48px 20px;text-align:center;color:var(--muted)}
.placeholder b{display:block;color:var(--ink);font-size:14px;margin-bottom:4px}
.placeholder span{font-size:13px}

/* Breadcrumb */
.crumb{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:13px;margin-bottom:14px}
.crumb a{color:var(--green-dark);cursor:pointer;text-decoration:none;padding:4px 9px;border-radius:8px;font-weight:600}
.crumb a:hover{background:var(--green-soft)}
.crumb .sep{color:#b7c4bc}
.crumb b{color:var(--ink);padding:4px 9px}

/* Toolbar */
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:9px 15px;font-size:13px;font-weight:700;cursor:pointer;transition:.14s;font-family:inherit}
.btn-folder{background:var(--green-soft);color:var(--green-dark);border:1px solid var(--green-line)}
.btn-folder:hover{background:#dbf0e3}
.btn-link{background:var(--green);color:#fff}
.btn-link:hover{background:var(--green-dark)}
.btn-back{background:transparent;color:var(--muted);border:1px solid var(--line)}
.btn-back:hover{color:var(--green-dark);border-color:var(--green-line);background:#f6fbf8}

/* Daftar item */
.items{display:flex;flex-direction:column;gap:8px}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--white);transition:.14s}
.item:hover{border-color:var(--green-line);background:#f8fbf9}
.item .left{display:flex;align-items:center;gap:11px;min-width:0}
.item .ic{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.ic.folder{background:#fff4dc}
.ic.link{background:var(--green-soft)}
.item .meta{min-width:0}
.item .nm{font-size:14px;font-weight:600;color:var(--ink);word-break:break-word;cursor:pointer;text-decoration:none}
.item a.nm:hover{color:var(--green-dark);text-decoration:underline}
.item .fname{cursor:pointer}
.item .fname:hover{color:var(--green-dark)}
.item .sub{font-size:12px;color:var(--muted);margin-top:2px}
.item .right{display:flex;gap:4px;flex-shrink:0}
.icon-btn{border:0;background:transparent;cursor:pointer;font-size:14px;padding:7px;border-radius:8px;transition:.14s}
.icon-btn.edit:hover{background:var(--green-soft)}
.icon-btn.del:hover{background:#fdeceb}

/* Form */
.form{display:none;margin-top:14px;border:1px solid var(--line);border-radius:12px;padding:16px;background:#fbfdfc}
.form.show{display:block}
.form h4{margin:0 0 12px;font-size:12px;font-weight:800;letter-spacing:.4px;color:var(--muted);text-transform:uppercase}
.form label{display:block;font-size:12px;color:var(--muted);margin:0 0 5px;font-weight:600}
.form input{width:100%;padding:10px 12px;border:1px solid #d7e2db;border-radius:9px;margin-bottom:11px;font-size:13.5px;outline:none;font-family:inherit;color:var(--ink)}
.form input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(27,138,63,.12)}
.form .btns{display:flex;gap:8px;margin-top:2px}
.save,.cancel{flex:1;border:0;border-radius:9px;padding:11px;font-weight:700;cursor:pointer;font-family:inherit;font-size:13.5px}
.save{background:var(--green);color:#fff}
.save:hover{background:var(--green-dark)}
.cancel{background:#eef2ef;color:#3c4a41}
.cancel:hover{background:#e2e8e4}

/* Status */
.status{display:none;margin-bottom:14px;padding:10px 13px;border-radius:10px;font-size:13px;align-items:center;gap:8px;font-weight:600}
.status.show{display:flex}
.status.ok{background:var(--green-soft);color:var(--green-dark)}
.status.err{background:#fdeceb;color:#c5342b}
.status.wait{background:#fff7e6;color:#a56a00}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(0,0,0,.12);border-left-color:currentColor;border-radius:50%;animation:spin .55s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-fade{opacity:.55;pointer-events:none;transition:opacity .1s ease}
</style>
</head>
<body>
<div class="wrap">
<div class="card">

  <!-- TOP BAR -->
  <div class="topbar" id="topbar">
    <div class="brand" id="brandBtn">
      <span class="dot">🚚</span>
      <b>Laporan Google-Drive</b>
    </div>
    <div class="topbar-right">
      <div class="date-pill" id="datePill">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#1b8a3f" stroke-width="2.1" stroke-linecap="round">
          <rect x="3" y="4" width="18" height="18" rx="3"></rect>
          <path d="M16 2v4M8 2v4M3 10h18"></path>
        </svg>
        <input type="date" id="datePick">
        <span class="cs">⌄</span>
      </div>
      <span class="chev" id="chev">⌄</span>
    </div>
  </div>

  <!-- BODY -->
  <div class="body" id="body">

    <!-- Banner -->
    <div class="banner">
      <span class="chip-tag">📁 Arsip / Laporan</span>
      <h1>Laporan Google-Drive</h1>
      <p>Kelola laporan per bulan dengan folder bertingkat dan tautan Google Drive dalam tampilan yang rapi dan sederhana.</p>
    </div>

    <!-- Pilih bulan -->
    <div class="section">
      <div class="section-title">📅 Pilih Bulan</div>
      <div class="chips" id="chips"></div>
    </div>

    <!-- Konten -->
    <div class="content" id="loadingArea">
      <div class="status" id="status"></div>
      <div id="viewArea">
        <div class="placeholder">
          <b>Pilih bulan untuk mulai.</b>
          <span>Daftar folder & laporan akan muncul di sini.</span>
        </div>
      </div>
    </div>

  </div>
</div>
</div>

<script>
/* ============ KONFIGURASI ============ */
const API_URL = "https://script.google.com/macros/s/AKfycby2s_GI5jVMFymDidpv8gqfab4_01zHHINay_kb_i20JZ-CmdJDapuYFCnIyx6mnSOa/exec";
const NEED_VERSION = 4;
const CACHE_TTL = 30000;
const MONTHS = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];

/* ============ STATE ============ */
let currentMonth="", currentPath="", dataFolders=[], dataLinks=[];
let formMode="link", editKind=null, editIndex=null, statusTimeout=null;
const cache={};

/* ============ ELEMEN ============ */
const topbar=document.getElementById("topbar");
const brandBtn=document.getElementById("brandBtn");
const chev=document.getElementById("chev");
const body=document.getElementById("body");
const datePill=document.getElementById("datePill");
const datePick=document.getElementById("datePick");
const chips=document.getElementById("chips");
const viewArea=document.getElementById("viewArea");
const statusEl=document.getElementById("status");
const loadingArea=document.getElementById("loadingArea");

/* ============ TANGGAL ============ */
function todayISO(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
datePick.value=todayISO();
datePill.addEventListener("click",function(e){e.stopPropagation();});

/* ============ CHIPS BULAN ============ */
MONTHS.forEach(function(m){
  const c=document.createElement("div");
  c.className="chip"; c.textContent=m; c.dataset.month=m;
  c.onmouseover=function(){prefetch(m,"");};
  c.onclick=function(){openMonth(m);};
  chips.appendChild(c);
});
function setActiveChip(m){
  chips.querySelectorAll(".chip").forEach(function(c){
    c.classList.toggle("active", c.dataset.month===m);
  });
}

/* ============ CACHE ============ */
function ck(m,p){return m+"|"+p;}
function getCached(m,p){const c=cache[ck(m,p)];return c?c.data:null;}
function isStale(m,p){const c=cache[ck(m,p)];return !c||(Date.now()-c.ts>=CACHE_TTL);}
function setCache(m,p,d){cache[ck(m,p)]={data:d,ts:Date.now()};}

/* ============ BUKA/TUTUP ============ */
function expand(){body.style.maxHeight=body.scrollHeight+"px";}
function isOpen(){return topbar.classList.contains("open");}
function openDrop(){topbar.classList.add("open");expand();}
function closeDrop(){if(!isOpen())return;topbar.classList.remove("open");body.style.maxHeight=null;}
function toggleDrop(e){e.stopPropagation();isOpen()?closeDrop():openDrop();}
brandBtn.addEventListener("click",toggleDrop);
chev.addEventListener("click",toggleDrop);
document.querySelector(".card").addEventListener("click",function(e){e.stopPropagation();});
document.addEventListener("click",closeDrop);
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeDrop();});

/* ============ STATUS ============ */
function setStatus(msg,type){
  if(statusTimeout)clearTimeout(statusTimeout);
  statusEl.innerHTML=(type==="wait")?'<span class="spinner"></span><span>'+msg+'</span>':msg;
  statusEl.className="status show "+type;
  expand();
  if(type!=="wait")statusTimeout=setTimeout(function(){statusEl.className="status";expand();},3000);
}
function setLoader(on){loadingArea.classList.toggle("loading-fade",on);}

/* ============ FETCH ============ */
function doFetch(params,showLoader){
  const q=Object.keys(params).map(function(k){return encodeURIComponent(k)+"="+encodeURIComponent(params[k]);}).join("&");
  if(showLoader)setLoader(true);
  return fetch(API_URL+"?"+q+"&_ts="+Date.now(),{method:"GET",cache:"no-store"})
    .then(function(r){return r.text();})
    .then(function(t){
      if(showLoader)setLoader(false);
      let d;try{d=JSON.parse(t);}catch(e){throw new Error("Server tidak merespons dengan benar.");}
      if(d.v!==NEED_VERSION)throw new Error("Server versi lama (v"+(d.v||"?")+"). Deploy ulang Apps Script versi 4.");
      return d;
    })
    .catch(function(err){if(showLoader)setLoader(false);throw err;});
}
function prefetch(m,p){
  if(getCached(m,p))return;
  doFetch({action:"list",month:m,path:p},false).then(function(res){if(res.ok)setCache(m,p,res);}).catch(function(){});
}

/* ============ NAVIGASI ============ */
function openMonth(month){
  currentMonth=month;currentPath="";
  setActiveChip(month);
  if(!isOpen())openDrop();
  gotoPath("");
}
function gotoPath(path){
  currentPath=path;
  const cached=getCached(currentMonth,path);
  if(cached){apply(cached);if(isStale(currentMonth,path))refreshBg(currentMonth,path);}
  else{
    viewArea.innerHTML='<div class="placeholder"><span class="spinner" style="color:#1b8a3f"></span><br><br>Memuat...</div>';
    expand();
    doFetch({action:"list",month:currentMonth,path:path},true)
      .then(function(res){if(!res.ok)throw new Error(res.error||"Gagal memuat");setCache(currentMonth,path,res);apply(res);})
      .catch(function(err){viewArea.innerHTML='<div class="placeholder"><b>Gagal memuat data</b></div>';setStatus(err.message,"err");});
  }
}
function refreshBg(m,p){
  doFetch({action:"list",month:m,path:p},false).then(function(res){
    if(!res.ok)return;setCache(m,p,res);
    if(m===currentMonth&&p===currentPath)apply(res);
  }).catch(function(){});
}
function apply(res){dataFolders=res.folders||[];dataLinks=res.links||[];render();}

/* ============ RENDER ============ */
function render(){
  const el=document.createElement("div");

  /* breadcrumb */
  const crumb=document.createElement("div");crumb.className="crumb";
  const rootA=document.createElement("a");rootA.textContent="📅 "+currentMonth;rootA.onclick=function(){gotoPath("");};
  crumb.appendChild(rootA);
  const parts=currentPath?currentPath.split("/"):[];let acc="";
  parts.forEach(function(p,i){
    acc=acc?acc+"/"+p:p;
    const s=document.createElement("span");s.className="sep";s.textContent="›";crumb.appendChild(s);
    if(i===parts.length-1){const b=document.createElement("b");b.textContent="📁 "+p;crumb.appendChild(b);}
    else{const t=acc;const a=document.createElement("a");a.textContent="📁 "+p;a.onclick=function(){gotoPath(t);};crumb.appendChild(a);}
  });
  el.appendChild(crumb);

  /* toolbar */
  const tb=document.createElement("div");tb.className="toolbar";
  const tools=document.createElement("div");tools.className="tools";
  const bf=document.createElement("button");bf.className="btn btn-folder";bf.textContent="📁 Folder Baru";bf.onclick=openAddFolder;
  const bl=document.createElement("button");bl.className="btn btn-link";bl.textContent="＋ Laporan";bl.onclick=openAddLink;
  tools.appendChild(bf);tools.appendChild(bl);
  const bk=document.createElement("button");bk.className="btn btn-back";bk.textContent="‹ Pilih Bulan";bk.onclick=backMonths;
  tb.appendChild(tools);tb.appendChild(bk);
  el.appendChild(tb);

  /* form container */
  const formHost=document.createElement("div");formHost.id="formHost";el.appendChild(formHost);

  /* items */
  const items=document.createElement("div");items.className="items";
  if(!dataFolders.length&&!dataLinks.length){
    const ph=document.createElement("div");ph.className="placeholder";
    ph.innerHTML="<b>Masih kosong.</b><span>Tambahkan folder atau laporan.</span>";
    items.appendChild(ph);
  }else{
    dataFolders.forEach(function(f,i){
      const it=document.createElement("div");it.className="item";
      const left=document.createElement("div");left.className="left";
      const ic=document.createElement("div");ic.className="ic folder";ic.textContent="📁";
      const meta=document.createElement("div");meta.className="meta";
      const nm=document.createElement("div");nm.className="nm fname";nm.textContent=f.name;
      nm.onclick=function(){gotoPath(currentPath?currentPath+"/"+f.name:f.name);};
      const sub=document.createElement("div");sub.className="sub";sub.textContent="Folder";
      meta.appendChild(nm);meta.appendChild(sub);left.appendChild(ic);left.appendChild(meta);
      const right=document.createElement("div");right.className="right";
      right.appendChild(mkBtn("✏️","edit",function(){openEdit("folder",i);}));
      right.appendChild(mkBtn("🗑️","del",function(){deleteItem("folder",i);}));
      it.appendChild(left);it.appendChild(right);items.appendChild(it);
    });
    dataLinks.forEach(function(x,i){
      const it=document.createElement("div");it.className="item";
      const left=document.createElement("div");left.className="left";
      const ic=document.createElement("div");ic.className="ic link";ic.textContent="🔗";
      const meta=document.createElement("div");meta.className="meta";
      const a=document.createElement("a");a.className="nm";a.href=x.url;a.target="_blank";a.rel="noopener noreferrer";a.textContent=x.name;
      const sub=document.createElement("div");sub.className="sub";sub.textContent=x.date?("Laporan • "+fmtDate(x.date)):"Laporan";
      meta.appendChild(a);meta.appendChild(sub);left.appendChild(ic);left.appendChild(meta);
      const right=document.createElement("div");right.className="right";
      right.appendChild(mkBtn("✏️","edit",function(){openEdit("link",i);}));
      right.appendChild(mkBtn("🗑️","del",function(){deleteItem("link",i);}));
      it.appendChild(left);it.appendChild(right);items.appendChild(it);
    });
  }
  el.appendChild(items);

  viewArea.innerHTML="";viewArea.appendChild(el);
  expand();
}
function mkBtn(t,c,fn){const b=document.createElement("button");b.type="button";b.className="icon-btn "+c;b.textContent=t;b.onclick=fn;return b;}
function fmtDate(iso){const p=String(iso).split("-");if(p.length!==3)return iso;return Number(p[1])+"/"+Number(p[2])+"/"+p[0];}

function backMonths(){
  currentMonth="";currentPath="";dataFolders=[];dataLinks=[];
  setActiveChip("");
  viewArea.innerHTML='<div class="placeholder"><b>Pilih bulan untuk mulai.</b><span>Daftar folder & laporan akan muncul di sini.</span></div>';
  expand();
}

/* ============ FORM ============ */
function formHTML(){
  return '<div class="form show" id="formBox">'
    +'<h4 id="formTitle"></h4>'
    +'<label id="lblName">Nama</label><input type="text" id="nameInput">'
    +'<div id="linkFields"><label>URL</label><input type="text" id="urlInput" placeholder="https://...">'
    +'<label>Tanggal</label><input type="date" id="dateInput"></div>'
    +'<div class="btns"><button class="save" onclick="saveItem()">Simpan</button>'
    +'<button class="cancel" onclick="closeForm()">Batal</button></div></div>';
}
function mountForm(){document.getElementById("formHost").innerHTML=formHTML();}

function openAddFolder(){
  formMode="folder";editKind=null;editIndex=null;mountForm();
  document.getElementById("formTitle").textContent="TAMBAH FOLDER BARU";
  document.getElementById("lblName").textContent="Nama folder";
  document.getElementById("linkFields").style.display="none";
  document.getElementById("nameInput").focus();expand();
}
function openAddLink(){
  formMode="link";editKind=null;editIndex=null;mountForm();
  document.getElementById("formTitle").textContent="TAMBAH LAPORAN BARU";
  document.getElementById("lblName").textContent="Nama laporan";
  document.getElementById("dateInput").value=datePick.value||todayISO();
  document.getElementById("nameInput").focus();expand();
}
function openEdit(kind,index){
  formMode=kind;editKind=kind;editIndex=index;mountForm();
  if(kind==="folder"){
    const f=dataFolders[index];if(!f)return;
    document.getElementById("formTitle").textContent="EDIT NAMA FOLDER";
    document.getElementById("lblName").textContent="Nama folder";
    document.getElementById("nameInput").value=f.name;
    document.getElementById("linkFields").style.display="none";
  }else{
    const x=dataLinks[index];if(!x)return;
    document.getElementById("formTitle").textContent="EDIT LAPORAN";
    document.getElementById("lblName").textContent="Nama laporan";
    document.getElementById("nameInput").value=x.name;
    document.getElementById("urlInput").value=x.url;
    document.getElementById("dateInput").value=x.date||datePick.value;
  }
  document.getElementById("nameInput").focus();expand();
}
function closeForm(silent){const h=document.getElementById("formHost");if(h)h.innerHTML="";editKind=null;editIndex=null;if(!silent)expand();}

/* ============ SIMPAN ============ */
function saveItem(){
  const name=document.getElementById("nameInput").value.trim();
  if(!currentMonth){setStatus("Pilih bulan dulu.","err");return;}
  if(!name){setStatus("Nama wajib diisi.","err");return;}
  const isEdit=editIndex!==null;let params;
  if(formMode==="folder"){
    if(name.indexOf("/")>=0){setStatus("Nama folder tidak boleh memuat /","err");return;}
    params=isEdit?{action:"edit",kind:"folder",month:currentMonth,path:currentPath,index:editIndex,name:name}
                 :{action:"addFolder",month:currentMonth,path:currentPath,name:name};
    setStatus(isEdit?"Mengubah folder...":"Membuat folder...","wait");
  }else{
    let url=document.getElementById("urlInput").value.trim();
    if(!url){setStatus("URL wajib diisi.","err");return;}
    if(url.indexOf("http://")!==0&&url.indexOf("https://")!==0)url="https://"+url;
    const date=document.getElementById("dateInput").value||"";
    params=isEdit?{action:"edit",kind:"link",month:currentMonth,path:currentPath,index:editIndex,name:name,url:url,date:date}
                 :{action:"add",month:currentMonth,path:currentPath,name:name,url:url,date:date};
    setStatus(isEdit?"Menyimpan perubahan...":"Menyimpan laporan...","wait");
  }
  doFetch(params,true).then(function(res){
    if(!res.ok)throw new Error(res.error||"Gagal menyimpan");
    setCache(currentMonth,currentPath,res);apply(res);
    setStatus(isEdit?"Berhasil diubah.":"Berhasil ditambah.","ok");
  }).catch(function(err){setStatus(err.message,"err");});
}

/* ============ HAPUS ============ */
function deleteItem(kind,index){
  setStatus(kind==="folder"?"Menghapus folder & isinya...":"Menghapus laporan...","wait");
  doFetch({action:"delete",kind:kind,month:currentMonth,path:currentPath,index:index},true).then(function(res){
    if(!res.ok)throw new Error(res.error||"Gagal menghapus");
    setCache(currentMonth,currentPath,res);apply(res);
    setStatus("Berhasil dihapus.","ok");
  }).catch(function(err){setStatus(err.message,"err");});
}
</script>
