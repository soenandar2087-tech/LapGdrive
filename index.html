<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laporan Google-Drive</title>
<style>
/* ========== RESET & BASE ========== */
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:#f0f2f5;color:#202124;line-height:1.6;font-size:14px;
}
.wrap{max-width:780px;margin:24px auto;padding:0 16px}

/* ========== CARD UTAMA ========== */
.card{
  background:#fff;border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.08),0 4px 12px rgba(0,0,0,.04);
  overflow:hidden;transition:box-shadow .2s;
}
.card:hover{box-shadow:0 2px 6px rgba(0,0,0,.1),0 8px 20px rgba(0,0,0,.06)}

/* ========== HEADER BAR ========== */
.header{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 22px;background:#fff;border-bottom:1px solid #eef0f2;flex-wrap:wrap;gap:12px;
}
.header-left{display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none;-webkit-user-select:none}
.header-title{font-size:17px;font-weight:700;color:#1a73e8;display:flex;align-items:center;gap:8px}
.header-chevron{color:#5f6368;font-size:18px;width:28px;height:28px;
  display:flex;align-items:center;justify-content:center;border-radius:50%;
  transition:background .15s;
}
.header-chevron:hover{background:#f1f3f4}
.header-open .header-chevron{transform:rotate(180deg)}

/* Date Pill */
.date-pill{
  display:inline-flex;align-items:center;gap:8px;
  background:#fafafa;border:1px solid #dadce0;border-radius:999px;
  padding:7px 14px;font-size:13px;cursor:pointer;position:relative;
  box-shadow:0 1px 2px rgba(0,0,0,.05);
}
.date-pill svg{width:16px;height:16px;color:#137333;flex-shrink:0}
.date-pill input[type=date]{
  position:absolute;top:0;left:0;width:100%;height:100%;
  opacity:0;cursor:pointer;border:0;
}

/* ========== PILL BADGE HIJAU ========== */
.pill-green{
  display:inline-flex;align-items:center;gap:6px;
  background:#e6f4ea;color:#137333;font-size:12px;font-weight:600;
  padding:5px 12px;border-radius:999px;text-transform:uppercase;letter-spacing:.3px;
}
.pill-dot{width:7px;height:7px;border-radius:50%;background:#34a853;flex-shrink:0}

/* ========== PANELS ========== */
.panel{max-height:0;overflow:hidden;transition:max-height .25s ease-out;background:#fbfcfd}

/* BULAN (TAG STYLE) */
.month-grid{padding:18px 22px;display:flex;flex-wrap:wrap;gap:8px}
.tag-month{
  display:inline-flex;align-items:center;gap:6px;
  padding:8px 16px;border-radius:999px;
  font-size:13px;font-weight:500;color:#5f6368;
  cursor:pointer;border:1px solid transparent;
  transition:all .15s ease;
}
.tag-month:hover{background:#f1f3f4;color:#202124;border-color:#e0e0e0}
.tag-month.active-month{
  background:#dceffd;color:#1557b0;border-color:#a8c7fa;
  font-weight:600;
}

/* ISI LAPORAN */
.content-area{padding:0 22px 22px}
.section-header{
  margin-bottom:14px
}
.section-label{
  display:flex;align-items:center;gap:8px;
  font-size:11px;font-weight:700;color:#5f6368;text-transform:uppercase;letter-spacing:.5px;
  margin-bottom:12px;padding-left:4px;
}

/* ITEM LIST CLEAN */
.item-list{list-style:none}
.item-row{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:11px 14px;margin-bottom:6px;border-radius:12px;
  transition:background .12s ease;cursor:default;
}
.item-row:hover{background:#f5f7fa}
.item-main{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.item-icon{font-size:16px;flex-shrink:0;width:28px;text-align:center}
.item-name{
  font-size:14px;color:#1a73e8;font-weight:500;text-decoration:none;
  word-break:break-word;cursor:pointer;
}
.item-name:hover{text-decoration:underline;color:#174ea6}
.badge-date{
  font-size:11px;color:#9aa0a6;background:#f1f3f4;
  padding:3px 8px;border-radius:99px;white-space:nowrap;flex-shrink:0
}
.actions-mini{display:flex;gap:2px;opacity:0;transition:opacity .12s}
.item-row:hover .actions-mini{opacity:1}
.btn-icon{
  border:0;background:transparent;cursor:pointer;font-size:14px;
  padding:4px 8px;border-radius:6px;transition:background .12s
}
.btn-icon.edit:hover{background:#e8f0fe;color:#1967d2}
.btn-icon.del:hover{background:#fce8e6;color:#c5221f}

/* BREADCRUMB */
.breadcrumb{
  display:flex;align-items:center;flex-wrap:wrap;gap:6px;
  font-size:12px;margin-bottom:16px;color:#5f6368
}
.breadcrumb a{color:#1a73e8;text-decoration:none;padding:4px 8px;border-radius:6px}
.breadcrumb a:hover{background:#e8f0fe}
.breadcrumb span.divider{color:#dadce0;font-weight:300}
.breadcrumb b{color:#202124;font-weight:600}

/* NAV BAR */
.nav-bar{
  display:flex;align-items:center;justify-content:space-between;
  flex-wrap:wrap;gap:10px;margin-top:18px;
  padding-top:16px;border-top:1px dashed #e8eaed
}
.btn-group{display:flex;gap:8px}
.btn-outline{
  border:1px solid #dadce0;background:#fff;color:#3c4043;
  border-radius:8px;padding:9px 16px;font-size:13px;font-weight:600;
  cursor:pointer;display:inline-flex;align-items:center;gap:6px;
  transition:all .12s
}
.btn-outline:hover{background:#f8f9fa;border-color:#bdc1c6;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.btn-primary{
  border:1px solid transparent;background:#1a73e8;color:#fff;
  border-radius:8px;padding:9px 16px;font-size:13px;font-weight:600;
  cursor:pointer;display:inline-flex;align-items:center;gap:6px;
  transition:background .12s
}
.btn-primary:hover{background:#1557b0}
.back-link{font-size:13px;font-weight:600;color:#5f6368;cursor:pointer;padding:6px 12px;border-radius:6px}
.back-link:hover{color:#1a73e8;background:#f1f3f4}

/* FORM CARD */
.form-card{
  display:none;margin-top:14px;
  background:#f8f9fa;border:1px solid #e8eaed;border-radius:12px;
  padding:16px;animation:slideUp .18s ease-out
}
@keyframes slideUp{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.form-card.show{display:block}
.form-card label{
  display:block;font-size:12px;font-weight:700;color:#5f6368;margin-bottom:6px
}
.form-input{
  width:100%;padding:10px 14px;border:1px solid #dadce0;border-radius:10px;
  font-size:14px;font-family:inherit;outline:none;
  transition:border .12s,box-shadow .12s
}
.form-input:focus{border-color:#1a73e8;box-shadow:0 0 0 3px rgba(26,115,232,.12)}
.form-actions{display:flex;gap:8px;margin-top:10px}
.btn-submit{flex:1;border:0;border-radius:10px;padding:11px;font-size:14px;font-weight:700;cursor:pointer}
.btn-save{background:#1a73e8;color:#fff}
.btn-save:hover{background:#1557b0}
.btn-cancel{background:#fff;color:#5f6368;border:1px solid #dadce0}
.btn-cancel:hover{background:#f1f3f4}

/* STATUS PILL */
.status-pill{
  display:none;align-items:center;gap:8px;
  margin:12px 0;padding:10px 14px;border-radius:10px;font-size:13px;font-weight:500;
}
.status-pill.show{display:flex}
.status-ok{background:#e6f4ea;color:#137333}
.status-err{background:#fce8e6;color:#c5221f}
.status-wait{background:#fef7e0;color:#b06000}
.spinner-sm{display:inline-block;width:14px;height:14px;
  border:2px solid rgba(0,0,0,.1);border-left-color:currentColor;border-radius:50%;
  animation:spin .55s linear infinite;flex-shrink:0
}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-fade{opacity:.55;pointer-events:none}

.empty-state{
  text-align:center;padding:32px 16px;color:#9aa0a6;
}
.empty-state svg{width:48px;height:48px;margin-bottom:10px;fill:#dadce0}
</style>
</head>
<body>

<div class="wrap">

<!-- ==================== CARD UTAMA ==================== -->
<div class="card" id="mainBox">

  <!-- HEADER: Judul | Tanggal | Chevron -->
  <div class="header" id="headBar">
    <div class="header-left" id="mainToggle" onclick="toggleMain()">
      <div class="header-title">Laporan Google‑Drive</div>
      <div class="header-chevron" id="chevronIcon">⌄</div>
    </div>

    <div class="date-pill" id="datePill">
      <svg viewBox="0 0 24 24" fill="none" stroke="#137333" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      <span id="dateLabel">19/08/2026</span>
      <input type="date" id="datePick">
    </div>
  </div>

  <!-- PANEL BULAN -->
  <div class="panel" id="monthPanel">
    <div class="month-grid" id="monthGrid"></div>
  </div>

  <!-- PANEL KONTEN -->
  <div class="panel" id="reportPanel" style="display:none">
    <div class="content-area" id="loadingArea">

      <!-- Breadcrumb (muncul saat dalam folder) -->
      <div class="breadcrumb" id="breadcrumbEl"></div>

      <!-- Badge Header -->
      <div id="badgeHeader" style="margin-bottom:16px"></div>

      <!-- Section Label -->
      <div class="section-header">
        <span>📂</span><span class="section-label">DAFTAR ISIAN</span>
      </div>

      <!-- List Item -->
      <ul class="item-list" id="reportList"></ul>

      <!-- Status -->
      <div class="status-pill" id="statusEl"></div>

      <!-- Nav Bar -->
      <div class="nav-bar">
        <div class="btn-group">
          <button type="button" class="btn-outline" onclick="openAdd('folder')">📁 Folder Baru</button>
          <button type="button" class="btn-primary" onclick="openAdd('link')">＋ Tambah Laporan</button>
        </div>
        <span class="back-link" onclick="backToMonths()">← Kembali ke Bulan</span>
      </div>

      <!-- FORM ( tersembunyi default ) -->
      <div class="form-card" id="formCard">
        <label id="formTitle">TAMBAH LAPORAN BARU</label>
        <input type="text" class="form-input" id="nameInput" placeholder="Nama laporan / folder">
        <input type="text" class="form-input" id="urlInput" placeholder="URL https://..." style="margin-top:8px">
        <input type="date" class="form-input" id="dateInput" style="margin-top:8px">
        <div class="form-actions">
          <button type="button" class="btn-submit btn-save" onclick="saveItem()">Simpan</button>
          <button type="button" class="btn-submit btn-cancel" onclick="closeForm()">Batal</button>
        </div>
      </div>

    </div><!-- /content-area -->
  </div>

</div><!-- /card -->

</div><!-- /wrap -->

<script>
/* ========== KONFIG ========= */
const API_URL = "https://script.google.com/macros/s/AKfycby2s_GI5jVMFymDidpv8gqfab4_01zHHINay_kb_i20JZ-CmdJDapuYFCnIyx6mnSOa/exec";
const NEED_VERSION = 4;
const CACHE_TTL = 35000;
const MONTHS = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];

let currentMonth="", currentPath="", modeKind=null, editIndex=null, stTimer=null;
const cache={};
let folders=[], links=[];

/* DOM ELEMS */
const H=document.getElementById("headBar"), M=document.getElementById("monthPanel"),
R=document.getElementById("reportPanel"), RL=document.getElementById("reportList"),
BC=document.getElementById("breadcrumbEl"), BH=document.getElementById("badgeHeader"),
FC=document.getElementById("formCard"), FT=document.getElementById("formTitle"),
NI=document.getElementById("nameInput"), UI=document.getElementById("urlInput"),
DI=document.getElementById("dateInput"), SE=document.getElementById("statusEl"),
LA=document.getElementById("loadingArea");

const DP=document.getElementById("datePick");
function todayISO(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
DP.value=todayISO();
document.getElementById("dateLabel").textContent=fmtDisplay(DP.value);

DP.addEventListener("change",function(){ document.getElementById("dateLabel").textContent=fmtDisplay(this.value) });

/* ========== RENDER BULAN ========== */
MONTHS.forEach(function(m){
  const t=document.createElement("button"); t.className="tag-month"; t.textContent=m;
  t.onmouseenter=function(){prefetch(m,"")};
  t.onclick=function(){selectMonth(m)};
  document.getElementById("monthGrid").appendChild(t);
});

/* ========== TOGGLE ========= */
function expand(e){ e.style.maxHeight=e.scrollHeight+"px"; }
function isMainOpen(){ return H.classList.contains("header-open"); }
function toggleMain(){
  isMainOpen()?closeMain():openMain();
}
function openMain(){
  H.classList.add("header-open");
  if(R.style.display==="block"){expand(R);}else{expand(M);}
}
function closeMain(){
  H.classList.remove("header-open"); M.style.maxHeight=null; R.style.maxHeight=null;
}
document.addEventListener("click",function(e){
  if(!H.contains(e.target)&&!R.contains(e.target)) closeMain();
});

/* ========== API HELPERS ========= */
function k(m,p){return m+"|"+p}
function getC(m,p){const c=cache[k(m,p)];return c?c.data:null}
function stale(m,p){const c=cache[k(m,p)];return!c||Date.now()-c.ts>CACHE_TTL}
function put(m,p,d){cache[k(m,p)]={data:d,ts:Date.now()}}

function setStatus(msg,cls){
  if(stTimer)clearTimeout(stTimer);
  SE.innerHTML=(cls==="wait")
    ?'<span class="spinner-sm"></span>'+msg:msg;
  SE.className="status-pill show "+cls;
  if(cls==="wait"){
    LA.className="loading-fade";
  }else{
    LA.className="";
    stTimer=setTimeout(()=>SE.className="status-pill",3200);
  }
}

function fetchApi(params,loader){
  const q=Object.keys(params).map(k=>encodeURIComponent(k)+"="+encodeURIComponent(params[k])).join("&");
  if(loader){LA.className="loading-fade";}
  return fetch(API_URL+"?"+q+"&_t="+Date.now(),{method:"GET",cache:"no-store"})
    .then(r=>r.text()).then(t=>{
      if(loader)LA.className="";
      let o;try{o=JSON.parse(t)}catch(e){throw new Error("Server tidak merespons")}
      if(o.v!==NEED_VERSION)throw new Error("Server versi lama. Deploy ulang versi 4.");
      return o;
    }).catch(err=>{if(loader)LA.className=""; throw err});
}

function prefetch(m,p){if(getC(m,p))return;fetchApi({action:"list",month:m,path:p},false).then(r=>{if(r.ok)put(m,p,r)}).catch(()=>{})}

/* ========== NAVIGASI ========= */
function selectMonth(m){
  currentMonth=m; currentPath="";
  closeForm(true);
  // highlight tag
  document.querySelectorAll(".tag-month").forEach(el=>el.classList.toggle("active-month",el.textContent.trim()===m));
  M.style.display="none"; M.style.maxHeight=null;
  R.style.display="block";
  openMain();
  goToPath("");
}

function backToMonths(){
  R.style.display="none"; R.style.maxHeight=null;
  M.style.display="block"; expand(M);
  currentMonth=""; folders=[]; links=[];
  SE.className="status";
  document.querySelectorAll(".tag-month").forEach(el=>el.classList.remove("active-month"));
}

function goToPath(path){
  currentPath=path;
  closeForm(true);
  const c=getC(currentMonth,path);
  if(c){
    applyData(c);
    if(stale(currentMonth,path))refreshBG(currentMonth,path);
  }else{
    setLoadingHtml();
    expand(R);
    fetchApi({action:"list",month:currentMonth,path:path},true)
      .then(r=>{if(!r.ok)throw new Error(r.error||"Gagal memuat");put(currentMonth,path,r);applyData(r)})
      .catch(e=>setEmptyErr(e.message));
  }
}

function refreshBG(m,p){
  fetchApi({action:"list",month:m,path:p},false)
    .then(r=>{if(!r.ok)return;put(m,p,r);if(m===currentMonth&&p===currentPath)applyData(r)})
    .catch(()=>{})
}

function applyData(res){
  folders=res.folders||[]; links=res.links||[]; renderList();
}

function setLoadingHtml(){
  RL.innerHTML='<li class="empty-state"><span class="spinner-sm" style="display:block;margin:auto;width:28px;height:28px;border-width:3px;color:#1a73e8"></span></li>';
}
function setEmptyErr(msg){
  RL.innerHTML='<li class="empty-state"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8l-6-6zm-1 2v5h5l-5-5z"/></svg><div>Tidak ada data.</div></li>';
  setStatus(msg,"err");
}

/* ========== RENDER ========= */
function renderList(){
  RL.innerHTML="";

  /* Breadcrumb */
  BC.innerHTML="";
  if(currentPath){
    BC.style.display="flex";
    const ra=document.createElement("a");ra.textContent=currentMonth;ra.onclick=function(){goToPath("")};BC.appendChild(ra);
    const parts=currentPath.split("/");
    let acc="";
    parts.forEach((p,i)=>{
      const s=document.createElement("span");s.className="divider";s.textContent="/";BC.appendChild(s);
      acc=acc?acc+"/"+p:p;
      if(i<parts.length-1){
        const a=document.createElement("a");a.textContent=p;a.onclick=function(){goToPath(acc)};BC.appendChild(a);
      }else{const b=document.createElement("b");b.textContent=p;BC.appendChild(b);}
    });
  } else {
    BC.style.display="none";
  }

  /* Badge Header */
  BH.innerHTML='<div class="pill-green"><span class="pill-dot"></span>'+currentMonth+(currentPath?" / "+partsOf(currentPath):"")+'</div>';

  if(!folders.length&&!links.length){
    RL.innerHTML='<li class="empty-state"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg><div>Kosong. Tambahkan folder atau laporan.</div></li>';
    expand(R); return;
  }

  /* Folders */
  folders.forEach((f,i)=>{
    const li=document.createElement("li");
    li.className="item-row";
    li.innerHTML=
      '<div class="item-main">'+
        '<span class="item-icon">📁</span>'+
        '<span class="item-name fname" onclick="goToPath(\''+escJS(currentPath?currentPath+"/"+f.name:f.name)+'\')">'+esc(f.name)+'</span>'+
      '</div>'+
      '<div class="actions-mini">'+
        '<button type="button" class="btn-icon edit" title="Edit" onclick="openEdit(\'folder\','+i+')">✏️</button>'+
        '<button type="button" class="btn-icon del" title="Hapus" onclick="delItem(\'folder\','+i+')">🗑️</button>'+
      '</div>';
    RL.appendChild(li);
  });

  /* Links */
  links.forEach((it,i)=>{
    const li=document.createElement("li");
    li.className="item-row";
    li.innerHTML=
      '<div class="item-main">'+
        '<span class="item-icon">🔗</span>'+
        '<a class="item-name" href="'+esc(it.url)+'" target="_blank" rel="noopener noreferrer">'+esc(it.name)+'</a>'+
        (it.date?'<span class="badge-date">'+fmtDisplay(it.date)+'</span>':'')+
      '</div>'+
      '<div class="actions-mini">'+
        '<button type="button" class="btn-icon edit" title="Edit" onclick="openEdit(\'link\','+i+')">✏️</button>'+
        '<button type="button" class="btn-icon del" title="Hapus" onclick="delItem(\'link\','+i+')">🗑️</button>'+
      '</div>';
    RL.appendChild(li);
  });
  expand(R);
}
function esc(s){const d=document.createElement("div");d.textContent=s;return d.innerHTML}
function escJS(s){return s.replace(/'/g,"\\'").replace(/"/g,'&quot;')}
function partsOf(p){return p.split("/").pop()}
function fmtDisplay(iso){if(!iso)return"";const p=iso.split("-");return p[1]+"/"+p[2]+"/"+p[0]}

/* ========== FORM ========= */
function openAdd(kind){
  modeKind=kind;editIndex=null;
  FT.textContent=kind==="folder"?"BUAT FOLDER BARU":"TAMBAH LAPORAN BARU";
  NI.placeholder=kind==="folder"?"Nama folder":"Nama laporan"; NI.value="";
  UI.style.display=kind==="folder"?"none":""; UI.value="";
  DI.style.display=kind==="folder"?"none":""; DI.value=DP.value;
  FC.className="form-card show";
  setTimeout(()=>NI.focus(),100); expand(R);
}

function openEdit(kind,i){
  modeKind=kind;editIndex=i;
  FC.className="form-card show";
  if(kind==="folder"){
    FT.textContent="UBAH NAMA FOLDER"; NI.placeholder="Nama folder"; NI.value=folders[i].name||"";
    UI.style.display="none"; DI.style.display="none";
  }else{
    FT.textContent="UBAH LAPORAN"; NI.placeholder="Nama laporan"; NI.value=links[i].name||"";
    UI.style.display=""; UI.value=links[i].url||"";
    DI.style.display=""; DI.value=links[i].date||DP.value;
  }
  setTimeout(()=>NI.focus(),100); expand(R);
}

function closeForm(silent){
  FC.className="form-card"; editIndex=null; NI.value=""; UI.value=""; if(!silent)expand(R);
}

/* ========== CRUD ========= */
function saveItem(){
  const name=NI.value.trim();
  if(!currentMonth){setStatus("Pilih bulan.","err");return;}
  if(!name){setStatus("Nama wajib.","err");return;}

  const ed=editIndex!==null;
  let params;
  if(modeKind==="folder"){
    params=ed
      ?{action:"edit",kind:"folder",month:currentMonth,path:currentPath,index:editIndex,name:name}
      :{action:"addFolder",month:currentMonth,path:currentPath,name:name};
    setStatus(ed?"Mengubah nama...":"Membuat folder...","wait");
  }else{
    let url=UI.value.trim(); if(!url){setStatus("URL wajib.","err");return;}
    if(url.indexOf("http://")!==0&&url.indexOf("https://")!==0)url="https://"+url;
    params=ed
      ?{action:"edit",kind:"link",month:currentMonth,path:currentPath,index:editIndex,name:name,url:url,date:DI.value}
      :{action:"add",month:currentMonth,path:currentPath,name:name,url:url,date:DI.value};
    setStatus(ed?"Menyimpan...","Menyimpan...","wait");
  }

  fetchApi(params,true).then(r=>{
    if(!r.ok)throw new Error(r.error||"Gagal menyimpan");
    put(currentMonth,currentPath,r); applyData(r); closeForm(true);
    setStatus(ed?"Berhasil diubah.":"Berhasil ditambah.","ok");
  }).catch(e=>setStatus(e.message,"err"));
}

function delItem(kind,i){
  setStatus(kind==="folder"?"Menghapus folder & isinya...":"Menghapus laporan...","wait");
  fetchApi({action:"delete",kind:kind,month:currentMonth,path:currentPath,index:i},true)
    .then(r=>{if(!r.ok)throw new Error(r.error||"Gagal hapus");put(currentMonth,currentPath,r);applyData(r);setStatus("Berhasil dihapus.","ok")})
    .catch(e=>setStatus(e.message,"err"));
}

</script>
